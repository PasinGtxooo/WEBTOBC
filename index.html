<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web-to-BC Order Agent</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"Segoe UI",Tahoma,sans-serif;background:#f0f2f5;color:#1a1d24;padding:24px;}
  .logo{width:72px;height:72px;margin-bottom:16px;}
  h1{font-size:24px;margin:0 0 4px;}
  p.sub{color:#6b7280;margin:0 0 28px;font-size:14px;}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  a.card{width:220px;text-decoration:none;color:inherit;background:#fff;border:1px solid #e2e5ea;
    border-radius:14px;padding:24px;text-align:center;transition:.15s;display:block;}
  a.card:hover{border-color:#2b5cff;transform:translateY(-3px);box-shadow:0 8px 20px rgba(43,92,255,.12);}
  .card .emoji{font-size:40px;}
  .card h2{font-size:18px;margin:12px 0 6px;}
  .card span{font-size:13px;color:#6b7280;}
  .foot{margin-top:28px;font-size:12px;color:#9ca3af;text-align:center;}
</style>
</head>
<body>
  <img src="icon.svg" class="logo" alt="">
  <h1>Web-to-BC Order Agent</h1>
  <p class="sub">เดโม — รับออเดอร์ผ่านเว็บแชท เข้า Business Central</p>
  <div class="cards">
    <a class="card" href="customer.html">
      <div class="emoji">💬</div>
      <h2>หน้าลูกค้า</h2>
      <span>สั่งของผ่านแชท</span>
    </a>
    <a class="card" href="admin.html">
      <div class="emoji">🧾</div>
      <h2>หน้าแอดมิน</h2>
      <span>อนุมัติออเดอร์</span>
    </a>
  </div>
  <p class="foot">เปิด 2 หน้าคู่กันเพื่อดูการทำงานแบบ real-time</p>
</body>
</html>
