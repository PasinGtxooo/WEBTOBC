<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web-to-BC Order Agent</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"Segoe UI",Tahoma,sans-serif;background:#f0f2f5;color:#1a1d24;padding:24px;}
  .logo{width:80px;height:80px;margin-bottom:16px;}
  h1{font-size:26px;margin:0 0 6px;}
  p.sub{color:#6b7280;margin:0 0 28px;font-size:15px;text-align:center;}
  a.card{width:260px;text-decoration:none;color:inherit;background:#fff;border:1px solid #e2e5ea;
    border-radius:14px;padding:28px;text-align:center;transition:.15s;display:block;}
  a.card:hover{border-color:#2b5cff;transform:translateY(-3px);box-shadow:0 10px 24px rgba(43,92,255,.14);}
  .card .emoji{font-size:44px;}
  .card h2{font-size:19px;margin:12px 0 6px;}
  .card span{font-size:13px;color:#6b7280;}
  .foot{margin-top:26px;font-size:12px;color:#9ca3af;text-align:center;}
</style>
</head>
<body>
  <img src="icon.svg" class="logo" alt="">
  <h1>Web-to-BC Order Agent</h1>
  <p class="sub">สั่งของผ่านแชท เข้า Business Central อัตโนมัติ</p>
  <a class="card" href="customer.html">
    <div class="emoji">💬</div>
    <h2>เริ่มสั่งของ</h2>
    <span>พิมพ์สั่งของเป็นภาษาคนได้เลย</span>
  </a>
  <p class="foot">ออเดอร์จะเข้า Business Central รอแอดมินอนุมัติในระบบ</p>
</body>
</html>
