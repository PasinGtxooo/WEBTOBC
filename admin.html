<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แอดมิน — Web-to-BC Order Agent</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  * { box-sizing: border-box; }
  :root{--bg:#f0f2f5;--panel:#fff;--line:#e2e5ea;--brand:#2b5cff;--brand-dark:#1e3fb0;
    --text:#1a1d24;--muted:#6b7280;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;}
  body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);}
  header{background:#111827;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;}
  header h1{font-size:18px;margin:0;}
  header .tag{font-size:12px;background:rgba(255,255,255,.15);padding:3px 8px;border-radius:20px;}
  .wrap{max-width:620px;margin:16px auto;padding:0 12px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;height:80vh;overflow:hidden;}
  .panel-head{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;
    display:flex;align-items:center;justify-content:space-between;}
  .panel-head .sub{font-size:12px;color:var(--muted);font-weight:400;}
  .queue{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
  .empty{color:var(--muted);text-align:center;margin-top:60px;font-size:14px;}
  .order{border:1px solid var(--line);border-radius:10px;padding:12px;}
  .order .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .order .cust{font-weight:600;}
  .order table{width:100%;border-collapse:collapse;font-size:13px;}
  .order td{padding:3px 0;}
  .order td.q{text-align:center;color:var(--muted);width:60px;}
  .order td.p{text-align:right;width:90px;}
  .order .total{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-weight:600;text-align:right;}
  .order .acts{display:flex;gap:8px;margin-top:10px;}
  .order .acts button{flex:1;padding:7px;border-radius:8px;border:0;cursor:pointer;font-size:13px;}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-no{background:#fff;color:var(--danger);border:1px solid var(--danger)!important;}
  .badge{font-size:11px;padding:2px 7px;border-radius:10px;}
  .badge.warn{background:#fef3c7;color:var(--warn);}
  .badge.draft{background:#e0e7ff;color:var(--brand-dark);}
</style>
</head>
<body>
<header>
  <h1>🧾 หน้าแอดมิน</h1>
  <span class="tag">Web-to-BC Order Agent · เดโม</span>
</header>
<div class="wrap">
  <div class="panel">
    <div class="panel-head">
      <span>ออเดอร์รออนุมัติ</span>
      <span class="sub" id="queueCount">—</span>
    </div>
    <div class="queue" id="queue"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
const q=document.getElementById("queue");

async function render(){
  let orders;
  try{ orders=await DB.draftOrders(); }
  catch(e){ q.innerHTML='<div class="empty">⚠️ ต่อ Supabase ไม่ได้ — เช็ก config.js</div>'; return; }
  document.getElementById("queueCount").textContent=orders.length+" รายการ";
  if(!orders.length){q.innerHTML='<div class="empty">ยังไม่มีออเดอร์<br>รอลูกค้าสั่งของเข้ามา…</div>';return;}
  q.innerHTML="";
  orders.forEach(o=>{
    const div=document.createElement("div");div.className="order";
    const rows=o.lines.map(l=>`<tr><td>${l.name}</td><td class="q">×${l.qty}</td><td class="p">${(l.price*l.qty).toLocaleString()}</td></tr>`).join("");
    const t=new Date(o.created_at).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
    div.innerHTML=`
      <div class="top">
        <span class="cust">${o.cust_name}</span>
        <span>
          <span class="badge draft">ร่าง #${o.id}</span>
          ${o.need_supervisor?'<span class="badge warn">รอหัวหน้าอนุมัติ</span>':''}
        </span>
      </div>
      <table>${rows}</table>
      <div class="total">รวม ${o.total.toLocaleString()} บาท · ${t}</div>
      <div class="acts">
        <button class="btn-ok" onclick="decide(${o.id},'approved')">อนุมัติ</button>
        <button class="btn-no" onclick="decide(${o.id},'rejected')">ปฏิเสธ</button>
      </div>`;
    q.appendChild(div);
  });
}

async function decide(id,status){
  await DB.setStatus(id,status);
  render();
}

setInterval(render,1500);
render();
</script>
</body>
</html>
