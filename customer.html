<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลูกค้า — Web-to-BC Order Agent</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  * { box-sizing: border-box; }
  :root{--bg:#f0f2f5;--panel:#fff;--line:#e2e5ea;--brand:#2b5cff;--brand-dark:#1e3fb0;
    --text:#1a1d24;--muted:#6b7280;--bot:#eef1f7;--user:#2b5cff;}
  body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--brand);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;}
  header h1{font-size:18px;margin:0;}
  header .tag{font-size:12px;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:20px;}
  .wrap{max-width:560px;margin:16px auto;padding:0 12px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;height:80vh;overflow:hidden;}
  .panel-head{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .panel-head .sub{font-size:12px;color:var(--muted);font-weight:400;}
  select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;}
  .chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:80%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;}
  .msg.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:var(--user);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
  .chat-input input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:20px;font-size:14px;}
  .chat-input button{background:var(--brand);color:#fff;border:0;padding:0 18px;border-radius:20px;cursor:pointer;font-size:14px;}
  .chat-input button:disabled{background:#9db0ff;cursor:default;}
</style>
</head>
<body>
<header>
  <h1>💬 หน้าลูกค้า</h1>
  <span class="tag">Web-to-BC Order Agent · เดโม</span>
</header>
<div class="wrap">
  <div class="panel">
    <div class="panel-head">
      <span>สั่งของ</span>
      <span class="sub">ลูกค้า: <select id="custSelect"></select></span>
    </div>
    <div class="chat" id="chat"></div>
    <div class="chat-input">
      <input id="input" placeholder='เช่น เอาน้ำดื่ม 50 แพ็ค กับทิชชู่ 10 แพ็ค' autocomplete="off" disabled>
      <button id="sendBtn" disabled>ส่ง</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let customers=[], items=[], currentCust=null, draftCart=[];
const myOrders={};   // {orderId: lastStatus} ไว้รับข้อความตอบกลับ

const chatEl=document.getElementById("chat");
const inputEl=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");
const custSel=document.getElementById("custSelect");

function addMsg(t,c){const d=document.createElement("div");d.className="msg "+c;d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}
const userSay=t=>addMsg(t,"user"), botSay=t=>addMsg(t,"bot"), sysSay=t=>addMsg(t,"sys");
function greet(){botSay(`สวัสดีครับ ร้าน${currentCust.name} 😊\nพิมพ์สั่งของได้เลย เช่น "เอาน้ำดื่ม 50 แพ็ค กับทิชชู่ 10 แพ็ค"`);}

async function init(){
  try{
    customers=await DB.customers();
    items=await DB.items();
    if(!customers.length){botSay("⚠️ ยังไม่มีข้อมูลในฐานข้อมูล — รัน schema.sql ใน Supabase ก่อนครับ");return;}
    customers.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=c.name;custSel.appendChild(o);});
    currentCust=customers[0];
    inputEl.disabled=false; sendBtn.disabled=false;
    greet();
  }catch(e){
    botSay("⚠️ ต่อ Supabase ไม่ได้ — เช็กค่าใน config.js ครับ\n"+e.message);
  }
}

custSel.onchange=()=>{currentCust=customers[custSel.value];draftCart=[];greet();};
sendBtn.onclick=handleSend;
inputEl.addEventListener("keydown",e=>{if(e.key==="Enter")handleSend();});

async function handleSend(){
  const text=inputEl.value.trim(); if(!text||!currentCust)return;
  inputEl.value=""; userSay(text);
  if(/^(ยืนยัน|ok|โอเค|ตกลง|เอาเลย|confirm)/i.test(text)&&draftCart.length){await createOrder();return;}
  if(/^(ยกเลิก|cancel|ไม่เอา)/i.test(text)){draftCart=[];botSay("ยกเลิกรายการแล้วครับ พิมพ์สั่งใหม่ได้เลย");return;}
  const found=parseOrder(text,items);
  if(!found.length){botSay("ขอโทษครับ ไม่เจอสินค้าที่ตรงกับที่พิมพ์มา\nลองพิมพ์ชื่อสินค้า เช่น น้ำดื่ม โคล่า ทิชชู่ ขนม");return;}
  draftCart=found; quoteBack();
}

function quoteBack(){
  let lines=[],total=0,stockWarn=[];
  draftCart.forEach(({item,qty})=>{const sub=item.price*qty;total+=sub;
    lines.push(`• ${item.name} × ${qty} = ${sub.toLocaleString()} บาท`);
    if(qty>item.stock)stockWarn.push(item.name);});
  let msg="รายการที่สั่ง:\n"+lines.join("\n")+`\n\nรวม ${total.toLocaleString()} บาท`;
  if(stockWarn.length)msg+=`\n\n⚠️ สินค้าไม่พอ: ${stockWarn.join(", ")} — แอดมินจะติดต่อกลับ`;
  // เช็กวงเงิน — ตอบแค่ผ่าน/ไม่ผ่าน ไม่บอกตัวเลข
  if(currentCust.blocked){botSay(msg+"\n\n🚫 บัญชีนี้ค้างชำระ กรุณาติดต่อฝ่ายขายครับ");draftCart=[];return;}
  if(total>currentCust.credit_left){botSay(msg+"\n\n🚫 ยอดเกินวงเงินเครดิต กรุณาติดต่อฝ่ายขายครับ");draftCart=[];return;}
  botSay(msg+`\n\nพิมพ์ "ยืนยัน" เพื่อส่งออเดอร์ครับ`);
}

async function createOrder(){
  const used=await DB.countToday(currentCust.no);
  if(used>=MAX_ORDERS_PER_DAY){botSay(`วันนี้สั่งครบ ${MAX_ORDERS_PER_DAY} ออเดอร์แล้วครับ กรุณาสั่งใหม่พรุ่งนี้`);draftCart=[];return;}
  let total=0;
  const lines=draftCart.map(({item,qty})=>{total+=item.price*qty;return{name:item.name,qty,price:item.price};});
  const order=await DB.addOrder({cust_no:currentCust.no,cust_name:currentCust.name,lines,total,need_supervisor:total>APPROVAL_LIMIT});
  if(!order){botSay("⚠️ บันทึกออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้งครับ");return;}
  myOrders[order.id]="draft";
  botSay(`✅ สร้างออเดอร์ #${order.id} เรียบร้อย (ยอด ${total.toLocaleString()} บาท)\nรอแอดมินอนุมัติสักครู่นะครับ`);
  draftCart=[];
}

/* เช็กสถานะออเดอร์ของตัวเองทุก 1.5 วินาที */
async function pollStatus(){
  const ids=Object.keys(myOrders).map(Number).filter(id=>myOrders[id]==="draft");
  if(!ids.length)return;
  const rows=await DB.ordersStatus(ids);
  rows.forEach(r=>{
    if(r.status===myOrders[r.id])return;
    myOrders[r.id]=r.status;
    if(r.status==="approved"){sysSay(`— แอดมินอนุมัติออเดอร์ #${r.id} —`);botSay(`🎉 ออเดอร์ #${r.id} ได้รับการอนุมัติแล้ว! เราจะจัดส่งให้เร็วที่สุดครับ`);}
    else if(r.status==="rejected"){sysSay(`— แอดมินปฏิเสธออเดอร์ #${r.id} —`);botSay(`ออเดอร์ #${r.id} ไม่ผ่านการอนุมัติครับ ฝ่ายขายจะติดต่อกลับ`);}
  });
}
setInterval(pollStatus,1500);

init();
</script>
</body>
</html>
